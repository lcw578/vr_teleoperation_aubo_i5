  selection: 条件数分层（0-25/25-40/40-60/60-100/100-200 各 2 个）＋ 2 个 cond>200 的对照（预期触发奇异急停，用于确认保护有效）
  condition_number: 6×6 臂雅可比（取点=夹持点 gripper_tip_link）的 σmax/σmin
  note: q 是采样出的关节角，position/orientation 由 FK 导出——反向校验会从 q 重算并与表里的值比对
