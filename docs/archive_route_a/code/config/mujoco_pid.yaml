# 位置环 PID 增益（mujoco_ros2_control 内置 control_toolbox PID）
#
# 谁读它：`mujoco_ros2_control` 的 ros2_control_node。插件在
#   `mujoco_system_interface.cpp` 里按 `pid_gains.position.<关节名>` 建 PidROS；
#   **三项增益只要都有限，就启用 PID 路径**（`is_position_pid_control_enabled`），
#   否则退回"位置直通"（`is_position_control_enabled`，需要有 `<position>` 执行器）。
#   启用后它把 PID 的输出写进执行器的 ctrl —— 所以执行器必须是 **`<motor>`（力矩级）**。
# 传法：作为 ros2_control 节点的 parameters 传进去（见 launch/stage2a_mujoco.launch.py），
#   官方示例见 mujoco_ros2_control_demos/{config/mujoco_pid.yaml, launch/03_pid_control.launch.py}。
#
# ═══════════════════════════════════════════════════════════════════════════
# 为什么要有这一份（2026-09-24）
# ═══════════════════════════════════════════════════════════════════════════
# 标准路线的位置环就是每关节 PID：gazebo_ros2_control 用 control_toolbox::Pid（LARA 那条），
# mujoco_ros2_control 内置同一套。而 MuJoCo 原生 `<position>` 是纯 PD、**没有积分项**。
# MoveIt Servo 的位置流是 `q_cmd = 实测 + Δθ(单周期)`（锚在实测上），纯 PD 下误差建不起来，
# 实测速度增益只有 0.140–0.753（上臂最差）——机械臂按固定比例永远落后于命令。
# **积分项才是那一环的正解**（真机柜子用的是速度前馈，效果等价）。所以：
#   · `i` 必须 > 0（官方示例里 position PID 的 i 是 0，照抄会复现同样的毛病）
#   · `i_clamp_*` 就是抗积分饱和，替掉之前手写节点里的硬限幅
#
# ═══════════════════════════════════════════════════════════════════════════
# 当前取值：**起步值，待标定**（scripts/ 的标定台架，主指标 = 速度增益 → 1.0）
# ═══════════════════════════════════════════════════════════════════════════
#   p：取 25000/2500，使执行器在 80/25000 ≈ 3.2 mrad（腕 16/2500 ≈ 6.4 mrad）位置误差处
#      进入力矩饱和——与之前 `<position kp=25000/2500>` 的等效刚度一致，便于对照。
#   d：沿用之前那套速度反馈系数（来自 MuJoCo 对位置执行器自动算的阻尼 biasprm[2]：
#      435/841/488/29/31/11），使阻尼权威与旧配置相当。
#   i：先取 p/0.5 = 50000/5000（积分时间常数 0.5 s 量级，让它在遥操时间尺度上起作用），
#      **这一项是新的、也是待标定的重点**。
#   u_clamp：取该关节的力矩上限（与 ctrlrange、actuatorfrcrange 一致）。
#   i_clamp：同 u_clamp，防止积分在跟不上时无限累积。
#
# ⚠️ 官方示例的增益（p=15000/2000、d=1000/80、u_clamp=±10000）是给它自己那个 demo 机器人的，
#    不能照抄；而且它的 position PID i=0。
#
/**:
  ros__parameters:
    pid_gains:
      position:
        shoulder_joint:
          p: 25000.0
          i: 50000.0
          d: 435.0
          u_clamp_max: 80.0
          u_clamp_min: -80.0
          i_clamp_max: 80.0
          i_clamp_min: -80.0
        upperArm_joint:
          p: 25000.0
          i: 50000.0
          d: 841.0
          u_clamp_max: 80.0
          u_clamp_min: -80.0
          i_clamp_max: 80.0
          i_clamp_min: -80.0
        foreArm_joint:
          p: 25000.0
          i: 50000.0
          d: 488.0
          u_clamp_max: 60.0
          u_clamp_min: -60.0
          i_clamp_max: 60.0
          i_clamp_min: -60.0
        wrist1_joint:
          p: 2500.0
          i: 5000.0
          d: 29.0
          u_clamp_max: 16.0
          u_clamp_min: -16.0
          i_clamp_max: 16.0
          i_clamp_min: -16.0
        wrist2_joint:
          p: 2500.0
          i: 5000.0
          d: 31.0
          u_clamp_max: 16.0
          u_clamp_min: -16.0
          i_clamp_max: 16.0
          i_clamp_min: -16.0
        wrist3_joint:
          p: 2500.0
          i: 5000.0
          d: 11.0
          u_clamp_max: 10.0
          u_clamp_min: -10.0
          i_clamp_max: 10.0
          i_clamp_min: -10.0
