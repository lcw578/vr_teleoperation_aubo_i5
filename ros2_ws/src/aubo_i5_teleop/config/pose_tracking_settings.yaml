#################################
# PoseTracking 的 PID 参数（pose seeking）
#
# 底本：官方同版本发布的
#   /opt/ros/humble/share/moveit_servo/config/pose_tracking_settings.yaml
# 但**增益已按实测改过**（见下），其余键与官方一致。
#
# 为什么不能照抄增益：官方给 panda 的是比例 1.5、积分 0、微分 0；LARA（同款 Aubo i5 +
# Servo 的同类先例）用的是比例 500、积分 1、微分 0.1——相差约 300 倍。说明它与具体机器人、
# 控制器单位、控制频率强相关，必须实测。
#
# 实测（2026-09-22，gravcomp + SRDF 修复之后，环境干净、单节点）：
#   ---- 平移（+z 2 cm/s 走 4 s，看完成度）----
#     k_p = 1.5，k_i = 0   → 跟随完成度  58%
#     k_p = 20， k_i = 0   → 跟随完成度 102%
#     k_p = 100，k_i = 0   → 跟随完成度 100%
#     k_p = 20， k_i = 1   → 跟随完成度 102%（加积分无额外收益）
#   ---- 旋转（世界系轴 0.15 rad/s 走 2 s，六个方向）----
#     angular = 2   → 6/6 方向正确，但幅度只有指令的 ~55%
#     angular = 20  → 6/6 方向正确，幅度 ~99%
#     angular = 100 → 6/6 方向正确，幅度 ~100%（无额外收益）
# 取 k_p = 20、k_i = 0、angular = 20（当时的结论）。
#
# ⚠️ 2026-09-23 更正：上面那组是拿"完成度"选的，而完成度**对滞后不敏感**——
#    所以漏掉了动态响应。改用**阶跃响应**重标（位置模式，每轮先归位、Servo 停着归位）：
#      P=20  : τ 0.221 s，超调 +3.8%，稳态误差 1.4 mm
#      P=100 : τ 0.148 s，超调 +6.9%，稳态误差 0.0   ← τ 改善 1.5 倍
#      P=500 : τ 0.148 s，超调 +8.1%               ← 再提高无收益（τ 在 0.148 s 触底）
#    τ 在 0.148 s 触底说明**环路速度的上限不在外环增益上**，而在被控对象自身的滞后。
#    另注：角向仍是 20（未单独扫过）。
# 【已作废】当时的位置模式最终组合: P=100 + 滤波系数 30 -> τ 0.147-0.172 s、超调 ~0%、10 cm/s 99%。
#   作废原因见下方 09-23 二次更正：位置模式的结论不能直接搬到速度模式。
#
# P-only 对匀速目标必有 v/k_p 的稳态滞后——20 在 2 cm/s 下对应约 1 mm、在 0.15 rad/s 下
# 对应约 7.5 mrad，都可忽略；这正是平移从 58% 变 ~100%、旋转从 ~55% 变 ~99% 的原因。
#
# ⚠️ 2026-09-23 二次更正（**迁移到速度模式之后**，位置模式的那组值必须重新定）：
#    速度模式下没有位置伺服的位置刚度，环路阻尼更小；位置模式下定的 P=100 + 系数 30
#    在这里会进入**持续极限环**：命令长期在 ±3.15 rad/s（= joint_limits.yaml 的关节
#    速度上限）来回饱和、末端以 ~25 Hz 抖动（实测 1.5 s 内峰峰值 6.6 cm，RMS 命令
#    2.98 rad/s），且**给多少增益都一样抖**（P=20 也抖）——所以之前用"阶跃 τ"量到的
#    0.15 s 其实量的是这个振荡的包络，不是一阶滞后（这也是 τ 对 P 和对滤波系数都不敏感
#    的原因：环路一直在饱和）。
#    实测扫描（速度模式，scripts/closed_loop_probe.py，稳态=保持阶段最后 1.5 s）：
#      P=20 , 系数 1.5 → 稳态 p2p 3.9 mm，命令 RMS 0.000，误差 0.0000，上升 0.131 s
#      P=30 , 系数 1.5 → 稳态 p2p 0.0 mm，命令 RMS 0.000，误差 0.0000，上升 0.063-0.066 s（两次复现）
#      P=35 , 系数 1.5 → 稳态 p2p 0.0 mm，命令 RMS 0.000，误差 0.0000，上升 0.065 s
#      P=50 , 系数 1.5 → **失稳**：p2p 242 mm，命令 RMS 3.56，误差 -0.117 m（未收敛，可复现）
#      P=20 , 系数 30  → 稳但慢得多：上升 2.21 s
#      P=100, 系数 30  → **失稳**（当前默认值，必须改）
#    => 稳定边界在 P≈35~50（系数 1.5）；滤波系数越大边界越低（相位滞后）。
#    => 取 P=30、系数 1.5：稳（p2p 0.0）、准（误差 0.0000）、快（上升 0.065 s），
#       且离边界（50）留了一倍余量。**注意这条与"位置模式下的最优"相反**，因为两者
#       的阻尼条件不同。
#    角向增益仍是 20（未单独扫过，未发现震荡；列为待验证项）。
#
# 读取位置：PoseTracking::readROSParams() 以 `servo_parameters->ns + ".x_proportional_gain"`
# 取参，即参数名是 moveit_servo.x_proportional_gain（本文件的顶层键名由 launch 合并进
# moveit_servo 命名空间，与官方 launch 一致）。launch 另提供 pid_p / pid_i / pid_angular
# 覆盖参数便于调参，但增益只在构造时读取，改了必须重启。
#################################

# Maximum value of error integral for all PID controllers
windup_limit: 0.05

# PID gains  ← x/y/z 比例增益 = 30（速度模式，按**稳态是否静止**标定；见上方 09-23 二次更正）
# ⚠️ 2026-09-25 P 扫描（20/30/40，每档三张表 + 20 mm 阶跃探针，FK 通道）后定为 30：
#    · 延迟：正弦跟随 113 ms（P20）→ 83 ms（P30）→ 67 ms（P40）；起始延迟 32→30→27 ms。
#    · P30：survey 8/8 静止、零接触、阶跃 0% 超调、|cmd−q|≤0.087（钳位未触发）——全绿。
#    · P40：survey/sine 看着正常，但 20 mm 阶跃**超调 638–722%**、关节峰值速度 2.25–2.47 rad/s
#      （逼近厂商 2.618 限值）、1.07 s 断流后冻结在离目标 11–28 mm 处——高增益 + ~57 ms
#      有效回路延迟已到稳定边界，**否决**。P30 距该边界还有一倍余量，真机前不再上调。
#    · angular 同步取 30。**2026-09-25 晚补齐角向建表**（--axis rx/ry/rz，10°，0.1–1 Hz，
#      三个位姿）：rx/ry 全绿（幅值比 0.96–1.00、滞后恒定 0.078–0.087 s，与线向同水平）；
#      rz（世界系偏航）在 P02/P03 有真实降级（1 Hz 幅值比 0.85/0.58），根因是**腕型运动学**：
#      绕世界 z 的关节成本是 rx/ry 的 3–8 倍（‖q̇‖/rad/s：P01 3.1、P02 5.1、P03 8.4），
#      88–95% 压在 wrist1+wrist3——构型性质，非调参缺陷，真机预计同样存在。
#      （rz@P03 那行的基准偏了 66 mm——当轮穿越未到位，数据作废，但不影响上述结论。）
x_proportional_gain: 30.0
y_proportional_gain: 30.0
z_proportional_gain: 30.0
# 2026-09-27 对照 LARA（lara_moveit_servo/config/pose_tracking_settings.yaml：
# I=1.0/D=0.1）补积分与微分：VR 目标流的高频分量曾把内环激励成极限环
# （关节速度 p50 2.16 / 峰值 4.84 rad/s，超厂商限值）。I 消除稳态差并让
# 振荡收敛，D 提供阻尼。待真头显对照验证。
x_integral_gain: 1.0
y_integral_gain: 1.0
z_integral_gain: 1.0
x_derivative_gain: 0.1
y_derivative_gain: 0.1
z_derivative_gain: 0.1

angular_proportional_gain: 30.0
angular_integral_gain: 1.0
angular_derivative_gain: 0.1
