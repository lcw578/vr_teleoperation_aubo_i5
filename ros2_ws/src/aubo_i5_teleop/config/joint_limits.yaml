# MoveIt 的关节限位。
#
# 为什么要自己写一份：官方的 aubo_i5.urdf 把六个关节全写成 ±360°（±6.28319 rad），
# 而经确认后我们按 ±174°（±3.04 rad）使用——必须在这里覆盖，否则 MoveIt 会按 ±360° 规划，
# 与 MJCF 的物理限位和 ros2_control 的命令接口 min/max 不一致。
# 三处必须同步：本文件 / scene_aubo_i5.xml 的 joint range / URDF 的 command_interface min,max。
#
# ⚠️ ±3.04 rad (≈174.2°) 的来源是两个第三方 i5 模型，**尚未经 Aubo 官方数据手册核实**。
#
# 速度限位（2026-09-25 修正）：原来是官方 aubo_moveit_config 的 3.15/3.2——**超出厂商手册**。
# 按 AUBO-i5 & CB4 手册 V4.5.11（已入库）改为：关节 1-3 = 150°/s = 2.618 rad/s，
# 关节 4-6 = 180°/s = 3.142 rad/s，与 servo_interface.py 的 v_max 一致。
# 本文件被 stage2b（move_group）和 stage3（Servo 的 robot_description_planning）同时加载。
# 加速度：has_acceleration_limits: false → 下面的 max_acceleration 是死配置（未生效），
# 厂商手册也没有加速度规格，故保留原值并在此说明，不冒充有出处。

default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 0.1

joint_limits:
  foreArm_joint:
    has_position_limits: true
    min_position: -3.04
    max_position: 3.04
    has_velocity_limits: true
    max_velocity: 2.618
    has_acceleration_limits: false
    max_acceleration: 2.618
  shoulder_joint:
    has_position_limits: true
    min_position: -3.04
    max_position: 3.04
    has_velocity_limits: true
    max_velocity: 2.618
    has_acceleration_limits: false
    max_acceleration: 2.618
  upperArm_joint:
    has_position_limits: true
    min_position: -3.04
    max_position: 3.04
    has_velocity_limits: true
    max_velocity: 2.618
    has_acceleration_limits: false
    max_acceleration: 2.618
  wrist1_joint:
    has_position_limits: true
    min_position: -3.04
    max_position: 3.04
    has_velocity_limits: true
    max_velocity: 3.142
    has_acceleration_limits: false
    max_acceleration: 3.142
  wrist2_joint:
    has_position_limits: true
    min_position: -3.04
    max_position: 3.04
    has_velocity_limits: true
    max_velocity: 3.142
    has_acceleration_limits: false
    max_acceleration: 3.142
  wrist3_joint:
    has_position_limits: true
    min_position: -3.04
    max_position: 3.04
    has_velocity_limits: true
    max_velocity: 3.142
    has_acceleration_limits: false
    max_acceleration: 3.142
